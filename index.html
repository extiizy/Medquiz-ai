<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MedQuiz AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:18px 16px 44px}.top{display:flex;justify-content:space-between;align-items:center;padding:7px 2px 18px}
.logo{font-size:25px;font-weight:850}.pill{font-size:12px;font-weight:750;background:#e8eefc;color:#3156b8;border-radius:20px;padding:7px 10px}
.card{background:#fff;border:1px solid #e7ebf2;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 6px 20px rgba(30,45,70,.05)}
h1{font-size:30px;line-height:1.05;letter-spacing:-1px;margin:10px 0 8px}h2{font-size:20px;line-height:1.3}
p{color:#68758a;line-height:1.45}.upload{border:2px dashed #b8c4dc;text-align:center;background:#fbfcff;padding:24px}
input,select{width:100%;padding:13px;border:1px solid #dce2ec;border-radius:12px;background:white;margin:7px 0 12px;font-size:15px}
button{border:0;border-radius:14px;padding:13px 16px;font-weight:750;font-size:15px;cursor:pointer}.primary{width:100%;background:#3156b8;color:white}.secondary{background:#edf1f7;color:#26344d}.hidden{display:none}.muted{font-size:13px;color:#738095}.loader{padding:25px;text-align:center}.qhead{display:flex;justify-content:space-between;color:#6a778b;font-size:12px;font-weight:750}.option{display:block;width:100%;text-align:left;background:#f4f6fa;margin:8px 0;color:#1c2940}.option.correct{background:#dff5e8}.option.wrong{background:#fde3e3}.explain{background:#f7f9fc;border-radius:15px;padding:14px;line-height:1.5;font-size:14px;margin-top:12px}.nav{display:flex;gap:8px}.nav button{flex:1}.flashcard{min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:800;padding:20px}
</style>
</head>
<body><main class="app">
<div class="top"><div class="logo">MedQuiz AI</div><div class="pill">UKMPPD • AI</div></div>

<section id="setup">
<h1>Upload materi dosen.<br>Belajar lebih dalam.</h1>
<p>PPT/PDF → soal klinis → pembahasan → flashcard.</p>
<div class="card upload">
<div style="font-size:38px">📚</div>
<b id="filename">Pilih PPT atau PDF</b>
<div class="muted">File diproses oleh server AI kamu.</div>
<input id="file" type="file" accept=".pptx,.pdf" onchange="showFile()">
<label class="muted">Jumlah soal</label>
<select id="count"><option>5</option><option selected>10</option><option>20</option></select>
<label class="muted">Kesulitan</label>
<select id="difficulty"><option>mudah</option><option selected>sedang</option><option>sulit</option></select>
<button class="primary" onclick="generate()">✨ Generate Soal + Flashcard</button>
</div>
<div id="status" class="muted"></div>
</section>

<section id="loading" class="card loader hidden"><div style="font-size:34px">🧠</div><b>AI sedang membaca materi…</b><p>Menyiapkan vignette, opsi, pembahasan, dan flashcard.</p></section>

<section id="quiz" class="hidden">
<div class="card"><div class="qhead"><span id="progress"></span><span id="score"></span></div><h2 id="question"></h2><div id="options"></div><div id="explanation" class="explain hidden"></div></div>
<div class="nav"><button class="secondary" onclick="prevQ()">←</button><button class="primary" onclick="nextQ()">Lanjut →</button></div>
<button class="secondary" style="width:100%;margin-top:10px" onclick="showFlash()">🧠 Flashcards</button>
</section>

<section id="flash" class="hidden">
<div class="card"><div class="qhead"><span>FLASHCARD</span><span id="fnum"></span></div><div id="flashcard" class="flashcard"></div><button class="primary" onclick="flipCard()">Tampilkan / Sembunyikan Jawaban</button></div>
<div class="nav"><button class="secondary" onclick="prevF()">←</button><button class="secondary" onclick="nextF()">→</button></div>
<button class="secondary" style="width:100%;margin-top:10px" onclick="backQuiz()">← Kembali ke Soal</button>
</section>

<script>
let data=null,qi=0,fi=0,answers={},flipped=false;
const $=id=>document.getElementById(id);
function showFile(){let f=$("file").files[0];$("filename").textContent=f?f.name:"Pilih PPT atau PDF"}
async function generate(){
 const f=$("file").files[0]; if(!f){$("status").textContent="Pilih PPT/PDF dulu.";return}
 $("setup").classList.add("hidden");$("loading").classList.remove("hidden");
 const fd=new FormData();fd.append("file",f);fd.append("count",$("count").value);fd.append("difficulty",$("difficulty").value);
 try{let r=await fetch("/api/generate",{method:"POST",body:fd});let j=await r.json();if(!r.ok)throw Error(j.error||"Gagal");
 data=j;qi=0;fi=0;renderQ();$("loading").classList.add("hidden");$("quiz").classList.remove("hidden")
 }catch(e){$("loading").classList.add("hidden");$("setup").classList.remove("hidden");$("status").textContent="Error: "+e.message}
}
function renderQ(){let q=data.questions[qi];$("progress").textContent=`SOAL ${qi+1}/${data.questions.length}`;$("score").textContent=`Benar: ${Object.values(answers).filter(Boolean).length}`;$("question").textContent=q.question;let box=$("options");box.innerHTML="";
 Object.entries(q.options).forEach(([k,v])=>{let b=document.createElement("button");b.className="option";b.textContent=`${k}. ${v}`;b.onclick=()=>choose(k,b);box.appendChild(b)});
 $("explanation").classList.add("hidden");$("explanation").innerHTML=""
 if(answers[qi]){showAnswer(answers[qi])}
}
function choose(k,b){if(answers[qi])return;answers[qi]=k===data.questions[qi].answer;b.classList.add(answers[qi]?"correct":"wrong");showAnswer(k)}
function showAnswer(k){let q=data.questions[qi];document.querySelectorAll(".option").forEach(b=>{let letter=b.textContent[0];if(letter===q.answer)b.classList.add("correct");b.disabled=true});
 let html=`<b>Jawaban: ${q.answer}</b><br><br>${q.explanation}<br><br><b>Pembahasan opsi</b><ul>`;
 for(const [k,v] of Object.entries(q.option_explanations||{}))html+=`<li><b>${k}:</b> ${v}</li>`;html+=`</ul><b>High-yield:</b> ${q.high_yield||""}`;$("explanation").innerHTML=html;$("explanation").classList.remove("hidden")
}
function nextQ(){if(qi<data.questions.length-1){qi++;renderQ()}else alert("Selesai. Buka Flashcards untuk review.")}
function prevQ(){if(qi>0){qi--;renderQ()}}
function showFlash(){fi=0;flipped=false;$("quiz").classList.add("hidden");$("flash").classList.remove("hidden");renderF()}
function backQuiz(){$("flash").classList.add("hidden");$("quiz").classList.remove("hidden")}
function renderF(){let c=data.flashcards[fi];$("fnum").textContent=`${fi+1}/${data.flashcards.length}`;$("flashcard").textContent=flipped?c.back:c.front}
function flipCard(){flipped=!flipped;renderF()}function nextF(){fi=(fi+1)%data.flashcards.length;flipped=false;renderF()}function prevF(){fi=(fi-1+data.flashcards.length)%data.flashcards.length;flipped=false;renderF()}
</script>
</main></body></html>
